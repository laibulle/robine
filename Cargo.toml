[workspace]
resolver = "3"
members = [
  "crates/robine-domain",
  "crates/robine-application",
  "crates/robine-flow-ast",
  "crates/robine-flow-syntax",
  "crates/robine-flow-check",
  "crates/robine-flow-plan",
  "crates/robine-flow-runtime",
  "crates/robine-secret-store",
  "crates/robine-mqtt-contract",
  "crates/robine-mqtt-compat-ha",
  "crates/robine-protocol-mqtt",
  "crates/robine-matter-contract",
  "crates/robine-matterd",
  "crates/robine-integration-matter",
  "crates/robine-mcp-types",
  "crates/robine-mcp-tools",
  "crates/robine-mcp-http",
  "crates/robine-store-sqlite",
  "crates/robine-store-backup",
  "crates/robine-api-contract",
  "crates/robine-api-http",
  "crates/robine-integration-hue",
  "crates/robine-runtime",
  "apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Robine contributors"]

[workspace.dependencies]
actix-web = { version = "4.11", features = ["rustls-0_23"] }
actix-ws = "0.3"
actix-files = "0.6"
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
leptos = { version = "0.8", default-features = false, features = ["csr"] }
mdns-sd = "0.20"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
rumqttc = "0.25"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
